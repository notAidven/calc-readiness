<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 362" width="1020" height="362" role="img"><rect width="1020" height="362" fill="#FBF8F1"/><defs><filter id="soft0" x="-30%" y="-30%" width="160%" height="160%"><feColorMatrix type="saturate" values="1"/></filter><filter id="soft1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.75"/><feColorMatrix type="saturate" values="0.78"/></filter><filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5"/><feColorMatrix type="saturate" values="0.56"/></filter><filter id="soft3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.25"/><feColorMatrix type="saturate" values="0.34"/></filter><filter id="soft4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/><feColorMatrix type="saturate" values="0.12"/></filter></defs><text x="28" y="32" font-size="17" font-family="Georgia, serif" fill="#2C3639">Overview: a globe you rotate</text><text x="28" y="52" font-size="11.5" font-family="Georgia, serif" fill="#7F9095">Flat island patches on a sphere at the best achievable spread, one fixed orientation. Sized so the biggest island's cap is 12 degrees.</text><text x="28" y="67" font-size="11.5" font-family="Georgia, serif" fill="#7F9095">As a screen this is defensible; what it cannot do is show the sequence, because a sphere has no left and no right.</text><g><rect x="28" y="112" width="300" height="170" fill="#FBF8F1"/><clipPath id="c18"><rect x="28" y="112" width="300" height="170"/></clipPath><radialGradient id="gg18" cx="36%" cy="30%" r="80%"><stop offset="0%" stop-color="#AECFD7"/><stop offset="100%" stop-color="#8AB2BE"/></radialGradient><g clip-path="url(#c18)"><circle cx="178" cy="197" r="79.9" fill="url(#gg18)"/><g transform="translate(145.81,268.91) rotate(114.12) scale(0.17,1)"><circle cx="0" cy="0" r="15.76" fill="#D6D2C4"/><circle cx="0" cy="0" r="14.06" fill="#BFCBC8"/></g><text x="145.81" y="272.