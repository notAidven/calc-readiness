serif" fill="#7F9095">5 of 10 face the camera at this orientation</text><text x="28" y="323" font-size="10" font-family="Georgia, serif" fill="#7F9095">round the back: 1, 3, 5, 6, 8</text><text x="28" y="336" font-size="10" font-family="Georgia, serif" fill="#7F9095">the learner's own island happens to be facing you here</text></g><g><rect x="360" y="112" width="300" height="170" fill="#FBF8F1"/><clipPath id="c19"><rect x="360" y="112" width="300" height="170"/></clipPath><radialGradient id="gg19" cx="36%" cy="30%" r="80%"><stop offset="0%" stop-color="#AECFD7"/><stop offset="100%" stop-color="#8AB2BE"/></radialGradient><g clip-path="url(#c19)"><circle cx="510" cy="197" r="79.9" fill="url(#gg19)"/><g transform="translate(477.81,268.91) rotate(114.12) scale(0.17,1)"><circle cx="0" cy="0" r="15.76" fill="#D6D2C4"/><circle cx="0" cy="0" r="14.06" fill="#BFCBC8"/></g><text x="477.81" y="272.31" text-anchor="middle" font-size="9.5" font-family="Georgia, serif" fill="#7F9095" stroke="#BFCBC8" stroke-width="2.2" paint-order="stroke">10</text><g transform="translate(563.6,252.93) rotate(46.22) scale(0.24,1)"><circle cx="0" cy="0" r="15.76" fill="#D6D2C4"/><circle cx="0" cy="0" r="14.06" fill="#BFCBC8"/></g><text x="563.6" y="256.33" text-anchor="middle" font-size="9.5" font-family="Georgia, serif" fill="#7F9095" stroke="#BFCBC8" stroke-width="2.2" paint-order="stroke">9</text><g transform="translate(467.93,141.07) rotate(-126.95) scale(0.48,1)"><circle cx="0" cy="0" r="15.33" fill="#E9DAB6"/><circle cx="0" cy="0" r="13.63" fill="#B4C9A2"/></g><text x="467.93" y="144.47" text-anchor="middle" font-size="9.5" font-family="Georgia, serif" fill="#2C3639" stroke="#B4C9A2" stroke-width="2.2" paint-order="stroke">2</text><g transform="translate(556.38,173.03) rotate(-27.33) scale(0.76,1)"><circle cx="0" cy="0" r="15.33" fill="#E9DAB6"/><circle cx="0" cy="0" r="13.63" fill="#B4C9A2"/></g><text x="556.38" y="176.43" text-anchor="middle" font-size="9.5" font-family="Georgia, serif" fi