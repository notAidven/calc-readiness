<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 340" width="1024" height="340" role="img"><rect width="1024" height="340" fill="#FBF8F1"/><defs><filter id="soft0" x="-30%" y="-30%" width="160%" height="160%"><feColorMatrix type="saturate" values="1"/></filter><filter id="soft1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.75"/><feColorMatrix type="saturate" values="0.78"/></filter><filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5"/><feColorMatrix type="saturate" values="0.56"/></filter><filter id="soft3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.25"/><feColorMatrix type="saturate" values="0.34"/></filter><filter id="soft4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/><feColorMatrix type="saturate" values="0.12"/></filter></defs><text x="28" y="32" font-size="17" font-family="Georgia, serif" fill="#2C3639">The overview's five island states</text><text x="28" y="52" font-size="11.5" font-family="Georgia, serif" fill="#7F9095">Haze is keyed to how far AHEAD an island is in the sequence, not to its distance from the camera — so panning the overview cannot resolve it and the count stays unreadable.</text><rect x="32" y="102" width="124" height="132" fill="#AECFD7" rx="3"/><circle cx="94" cy="168" r="46.8" fill="#E9DAB6"/><circle cx="94" cy="168" r="41.6" fill="#B4C9A2"/><rect x="79.5" y="162.34" width="7.78" height="10.61" rx="1.27" fill="#8E7A63"/><rect x="88.34" y="155.98" width="11.32" height="16.97" rx="1.27" fill="#8E7A63"/><rect x="100.72" y="165.17" width="7.78" height="7.78" rx="1.27" fill="#8E7A63"/><text x="94" y="154.69" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#2C3639" stroke="#B4C9A2" stroke-width="3.36" paint-order="stroke">1</text><text x="94" y="252" text-anchor="middle" font-size="11.5" font-family="Georgia, serif" fill="#2C3639">completed</text><rect x="162" y="102" width="124" height="132" fill="#AECFD7" rx="3"/><circle cx="224" cy="168" r="53.8" fill="none" stroke="#D98324" stroke-width="2.2"/><circle cx="224" cy="168" r="46.8" fill="#E9DAB6"/><circle cx="224" cy="168" r="41.6" fill="#9CC079"/><rect x="209.5" y="162.34" width="7.78" height="10.61" rx="1.27" fill="#7A5B3E"/><rect x="218.34" y="155.98" width="11.32" height="16.97" rx="1.27" fill="#7A5B3E"/><rect x="230.72" y="165.17" width="7.78" height="7.78" rx="1.27" fill="#7A5B3E"/><text x="224" y="154.69" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#2C3639" stroke="#9CC079" stroke-width="3.36" paint-order="stroke">2</text><text x="224" y="252" text-anchor="middle" font-size="11.5" font-family="Georgia, serif" fill="#2C3639">current</text><rect x="292" y="102" width="124" height="132" fill="#AECFD7" rx="3"/><g opacity="0.84" filter="url(#soft1)"><circle cx="354" cy="168" r="46.8" fill="#D6D2C4"/><circle cx="354" cy="168" r="41.6" fill="#BFCBC8"/><text x="354" y="154.69" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#7F9095" stroke="#BFCBC8" stroke-width="3.36" paint-order="stroke">3</text></g><text x="354" y="252" text-anchor="middle" font-size="11.5" font-family="Georgia, serif" fill="#2C3639">next</text><rect x="422" y="102" width="124" height="132" fill="#AECFD7" rx="3"/><g opacity="0.6" filter="url(#soft3)"><circle cx="484" cy="168" r="46.8" fill="#D6D2C4"/><circle cx="484" cy="168" r="41.6" fill="#BFCBC8"/></g><text x="484" y="252" text-anchor="middle" font-size="11.5" font-family="Georgia, serif" fill="#2C3639">three ahead</text><rect x="552" y="102" width="124" height="132" fill="#AECFD7" rx="3"/><g opacity="0.38" filter="url(#soft4)"><circle cx="614" cy="168" r="46.8" fill="#D6D2C4"/><circle cx="614" cy="168" r="41.6" fill="#BFCBC8"/></g><text x="614" y="252" text-anchor="middle" font-size="11.5" font-family="Georgia, serif" fill="#2C3639">five or more ahead</text><text x="28" y="276" font-size="10.5" font-family="Georgia, serif" fill="#7F9095">completed: full colour, its own era's palette, its city glyph. This is the record, and it is the whole claim of the archipelago over per-era islands.</text><text x="28" y="291" font-size="10.5" font-family="Georgia, serif" fill="#7F9095">current: the same, ringed, and the only one that renders in full when you click into it.</text><text x="28" y="306" font-size="10.5" font-family="Georgia, serif" fill="#7F9095">next: land, shore and water; no city. Legible enough to anticipate: a learner can see where they are going next.</text><text x="28" y="321" font-size="10.5" font-family="Georgia, serif" fill="#7F9095">three ahead: softened and desaturated. Still plainly an island, still clickable, but nothing on it can be counted.</text><text x="28" y="336" font-size="10.5" font-family="Georgia, serif" fill="#7F9095">five or more ahead: a suggestion of land. The scale reads; the count does not.</text></svg>
