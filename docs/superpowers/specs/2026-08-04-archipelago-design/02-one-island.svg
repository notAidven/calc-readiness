<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 372" width="1024" height="372" role="img"><rect width="1024" height="372" fill="#FBF8F1"/><defs><filter id="soft0" x="-30%" y="-30%" width="160%" height="160%"><feColorMatrix type="saturate" values="1"/></filter><filter id="soft1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.75"/><feColorMatrix type="saturate" values="0.78"/></filter><filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5"/><feColorMatrix type="saturate" values="0.56"/></filter><filter id="soft3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.25"/><feColorMatrix type="saturate" values="0.34"/></filter><filter id="soft4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/><feColorMatrix type="saturate" values="0.12"/></filter></defs><text x="28" y="32" font-size="17" font-family="Georgia, serif" fill="#2C3639">What an island is under the archipelago</text><text x="28" y="52" font-size="11.5" font-family="Georgia, serif" fill="#7F9095">Radii from ERA_LAND_DEMAND's per-era increments through landBudgetRadiusFor, plus GRASS_OVER_BUILDABLE (8) and ISLAND_SHORE_REACH (4).</text><circle cx="158" cy="206" r="115" fill="#AECFD7"/><circle cx="158" cy="206" r="97" fill="none" stroke="#D98324" stroke-width="2.2"/><circle cx="158" cy="206" r="90" fill="#E9DAB6"/><circle cx="158" cy="206" r="80" fill="#9CC079"/><rect x="130.12" y="195.12" width="14.96" height="20.4" rx="2.45" fill="#7A5B3E"/><rect x="147.12" y="182.88" width="21.76" height="32.64" rx="2.45" fill="#7A5B3E"/><rect x="170.92" y="200.56" width="14.96" height="14.96" rx="2.45" fill="#7A5B3E"/><circle cx="158" cy="206" r="60" fill="none" stroke="#2C3639" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/><line x1="158" y1="206" x2="218" y2="206" stroke="#2C3639" stroke-width="0.8" opacity="0.4"/><line x1="218" y1="206" x2="276" y2="78" stroke="#7F9095" stroke-width="0.7"/><circle cx="218" cy="206" r="2" fill="#2C3639"/><text x="281" y="81.5" font-size="10.5" font-family="Georgia, serif" fill="#2C3639">buildable 24 — one era's roster, civics and hall</text><line x1="158" y1="206" x2="238" y2="206" stroke="#2C3639" stroke-width="0.8" opacity="0.4"/><line x1="238" y1="206" x2="276" y2="98" stroke="#7F9095" stroke-width="0.7"/><circle cx="238" cy="206" r="2" fill="#2C3639"/><text x="281" y="101.5" font-size="10.5" font-family="Georgia, serif" fill="#2C3639">grass 32</text><line x1="158" y1="206" x2="248" y2="206" stroke="#2C3639" stroke-width="0.8" opacity="0.4"/><line x1="248" y1="206" x2="276" y2="118" stroke="#7F9095" stroke-width="0.7"/><circle cx="248" cy="206" r="2" fill="#2C3639"/><text x="281" y="121.5" font-size="10.5" font-family="Georgia, serif" fill="#2C3639">shore 36</text><text x="158" y="343" text-anchor="middle" font-size="11.5" font-family="Georgia, serif" fill="#2C3639">every island in the run is one of these</text><text x="158" y="359" text-anchor="middle" font-size="11.5" font-family="Georgia, serif" fill="#7F9095">buildable 22 to 27, grass 30 to 35, all of them under the 46 ceiling</text><text x="528" y="102" font-size="11.5" font-family="Georgia, serif" fill="#2C3639">the ten islands, to scale, against the single island era ten asks for</text><circle cx="643.5" cy="215" r="115.5" fill="none" stroke="#C2452D" stroke-width="1.3" stroke-dasharray="5 4"/><text x="643.5" y="346.5" text-anchor="middle" font-size="10.5" font-family="Georgia, serif" fill="#C2452D">grass 77, refused</text><circle cx="829" cy="215" r="51" fill="#E9DAB6"/><circle cx="829" cy="215" r="45" fill="#B4C9A2"/><rect x="813.32" y="208.88" width="8.42" height="11.48" rx="1.38" fill="#8E7A63"/><rect x="822.88" y="202" width="12.24" height="18.36" rx="1.38" fill="#8E7A63"/><rect x="836.27" y="211.94" width="8.42" height="8.42" rx="1.38" fill="#8E7A63"/><text x="829" y="200.6" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill