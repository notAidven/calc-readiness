<text x="40" y="452" font-size="13" fill="#2f3b46" text-anchor="start">A leg is drawn iff BOTH its islands are unlocked, which is already what archipelagoView computes from node states — so the traced path is a derived</text>
<text x="40" y="474" font-size="13" fill="#2f3b46" text-anchor="start">view of progress and stores nothing. It also cannot leak the ordering the haze exists to hide, because it never reaches a hazed island.</text>
