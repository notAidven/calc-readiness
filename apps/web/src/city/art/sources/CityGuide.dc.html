<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  @keyframes cg-bob { from { transform: translateY(2px); } to { transform: translateY(-4px); } }
  @keyframes cg-blink { 0%,90%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
  @keyframes cg-sway { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(3deg); } }
  @keyframes cg-wave { 0%,100% { transform: rotate(6deg); } 25% { transform: rotate(-26deg); } 50% { transform: rotate(4deg); } 75% { transform: rotate(-26deg); } }
  @keyframes cg-talk { 0%,100% { transform: scaleY(0.32); } 50% { transform: scaleY(1); } }
  @keyframes cg-float { 0% { transform: translateY(4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
  @keyframes cg-hat { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-3deg); } }
</style>
</helmet>
<svg viewBox="0 0 240 240" width="100%" height="100%" style="display:block;overflow:visible;">
  <!-- ambient city sparkles -->
  <g fill="{{ sparkColor }}" opacity="0.9">
    <rect x="42" y="60" width="7" height="7" rx="1.6" style="transform-box:fill-box;transform-origin:center;animation:cg-float 3.2s ease-in-out infinite;"></rect>
    <circle cx="196" cy="72" r="3.4" style="transform-box:fill-box;transform-origin:center;animation:cg-float 3.8s ease-in-out infinite 1.1s;"></circle>
    <rect x="188" y="118" width="6" height="6" rx="1.4" style="transform-box:fill-box;transform-origin:center;animation:cg-float 3.5s ease-in-out infinite 0.6s;"></rect>
    <circle cx="48" cy="120" r="3" style="transform-box:fill-box;transform-origin:center;animation:cg-float 4.1s ease-in-out infinite 1.8s;"></circle>
  </g>

  <!-- ground shadow -->
  <ellipse cx="120" cy="216" rx="56" ry="11" fill="rgba(6,20,15,0.30)"></ellipse>

  <g style="transform-box:fill-box;transform-origin:50% 100%;animation:cg-bob 2.6s ease-in-out infinite alternate;">
    <!-- feet -->
    <ellipse cx="101" cy="207" rx="15" ry="9" fill="#24564A"></ellipse>
    <ellipse cx="139" cy="207" rx="15" ry="9" fill="#24564A"></ellipse>

    <!-- left arm holding a rolled blueprint -->
    <g>
      <rect x="70" y="132" width="20" height="50" rx="10" fill="#2F6E5E"></rect>
      <circle cx="80" cy="184" r="12" fill="#F6E6C8"></circle>
      <g transform="rotate(-24 80 176)">
        <rect x="62" y="150" width="36" height="15" rx="7.5" fill="#EAF2ED"></rect>
        <rect x="62" y="150" width="7" height="15" rx="3.5" fill="#2F6E5E"></rect>
        <rect x="91" y="150" width="7" height="15" rx="3.5" fill="#2F6E5E"></rect>
        <line x1="74" y1="155" x2="90" y2="155" stroke="#7FB0A2" stroke-width="1.4"></line>
        <line x1="74" y1="159" x2="86" y2="159" stroke="#7FB0A2" stroke-width="1.4"></line>
      </g>
    </g>

    <!-- torso / hi-vis jacket -->
    <rect x="76" y="118" width="88" height="80" rx="30" fill="#2F6E5E"></rect>
    <rect x="94" y="122" width="52" height="76" rx="22" fill="#E7B24B"></rect>
    <rect x="101" y="126" width="9" height="70" rx="4.5" fill="#F6E6C8" opacity="0.85"></rect>
    <rect x="130" y="126" width="9" height="70" rx="4.5" fill="#F6E6C8" opacity="0.85"></rect>
    <!-- chest skyline badge -->
    <g transform="translate(108,150)">
      <rect x="0" y="0" width="24" height="20" rx="4" fill="#1F4E44"></rect>
      <rect x="3" y="9" width="5" height="9" fill="#EAF2ED"></rect>
      <rect x="9.5" y="5" width="5" height="13" fill="#EAF2ED"></rect>
      <rect x="16" y="8" width="5" height="10" fill="#EAF2ED"></rect>
    </g>

    <!-- right arm (waves) -->
    <g style="{{ armStyle }}">
      <rect x="150" y="132" width="20" height="48" rx="10" fill="#2F6E5E"></rect>
      <circle cx="160" cy="182" r="12" fill="#F6E6C8"></circle>
    </g>

    <!-- neck -->
    <rect x="110" y="104" width="20" height="16" rx="8" fill="#EAD3AE"></rect>

    <!-- head -->
    <circle cx="120" cy="86" r="42" fill="#F6E6C8"></circle>
    <ellipse cx="80" cy="88" rx="7" ry="9" fill="#F0DCBB"></ellipse>
    <ellipse cx="160" cy="88" rx="7" ry="9" fill="#F0DCBB"></ellipse>

    <!-- cheeks -->
    <ellipse cx="98" cy="98" rx="8" ry="5" fill="#E79E82" opacity="0.55"></ellipse>
    <ellipse cx="142" cy="98" rx="8" ry="5" fill="#E79E82" opacity="0.55"></ellipse>

    <!-- eyebrows -->
    <rect x="92" y="70" width="17" height="5" rx="2.5" fill="#8A5E3C"></rect>
    <rect x="131" y="70" width="17" height="5" rx="2.5" fill="#8A5E3C"></rect>

    <!-- open eyes (blink) -->
    <g style="{{ eyeOpenStyle }}">
      <g style="transform-box:fill-box;transform-origin:center;animation:cg-blink 4.2s ease-in-out infinite;">
        <ellipse cx="101" cy="86" rx="7" ry="9" fill="#22332C"></ellipse>
        <circle cx="103.4" cy="82.5" r="2.4" fill="#fff"></circle>
      </g>
      <g style="transform-box:fill-box;transform-origin:center;animation:cg-blink 4.2s ease-in-out infinite;">
        <ellipse cx="139" cy="86" rx="7" ry="9" fill="#22332C"></ellipse>
        <circle cx="141.4" cy="82.5" r="2.4" fill="#fff"></circle>
      </g>
    </g>
    <!-- happy eyes (cheer) -->
    <g style="{{ eyeHappyStyle }}" fill="none" stroke="#22332C" stroke-width="5" stroke-linecap="round">
      <path d="M93 89 Q101 79 109 89"></path>
      <path d="M131 89 Q139 79 147 89"></path>
    </g>

    <!-- mouth: smile (idle) + chatter (talk) -->
    <path d="M108 103 Q120 114 132 103" fill="none" stroke="#B5654A" stroke-width="4.5" stroke-linecap="round" style="{{ mouthSmileStyle }}"></path>
    <ellipse cx="120" cy="106" rx="8" ry="7" fill="#9C4A3A" style="{{ mouthTalkStyle }}"></ellipse>

    <!-- hard hat -->
    <g style="transform-box:fill-box;transform-origin:50% 90%;animation:cg-hat 3s ease-in-out infinite;">
      <ellipse cx="120" cy="58" rx="50" ry="13" fill="#E7B24B"></ellipse>
      <ellipse cx="120" cy="56" rx="50" ry="10" fill="#F0C165"></ellipse>
      <path d="M86 58 Q88 26 120 24 Q152 26 154 58 Z" fill="#E7B24B"></path>
      <path d="M86 58 Q88 26 120 24 Q136 25 145 40 Q120 30 96 52 Z" fill="#F0C165" opacity="0.75"></path>
      <rect x="115" y="26" width="10" height="30" rx="4" fill="#C9922F"></rect>
      <circle cx="120" cy="30" r="5" fill="#F6E6C8"></circle>
    </g>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:240},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;idle&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;talk&quot;,&quot;wave&quot;,&quot;cheer&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood || 'idle';
    const waving = mood === 'wave' || mood === 'cheer';
    const talk = mood === 'talk';
    const cheer = mood === 'cheer';
    return {
      sparkColor: '#E7B24B',
      armStyle: {
        transformBox: 'fill-box', transformOrigin: '50% 12%',
        animation: waving ? 'cg-wave 0.9s ease-in-out infinite' : 'cg-sway 3.4s ease-in-out infinite',
      },
      eyeOpenStyle: { display: cheer ? 'none' : 'block' },
      eyeHappyStyle: { display: cheer ? 'block' : 'none' },
      mouthSmileStyle: { opacity: talk ? 0 : 1, transition: 'opacity .15s' },
      mouthTalkStyle: talk
        ? { opacity: 1, transformBox: 'fill-box', transformOrigin: '50% 30%', animation: 'cg-talk 0.28s ease-in-out infinite' }
        : { opacity: 0 },
    };
  }
}
</script>
</body>
</html>
