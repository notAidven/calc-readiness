<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  @keyframes mk-bob { from { transform: translateY(0.7%); } to { transform: translateY(-1.4%); } }
  @keyframes mk-blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  @keyframes mk-sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
  @keyframes mk-point { 0%,100% { transform: rotate(4deg); } 30% { transform: rotate(-36deg); } 60% { transform: rotate(-29deg); } }
  @keyframes mk-talk { 0%,100% { transform: scaleY(0.32); } 50% { transform: scaleY(1); } }
  @keyframes mk-dust { 0% { transform: translateY(18%) scale(0.6); opacity: 0; } 30% { opacity: 0.85; } 100% { transform: translateY(-110%) scale(1.05); opacity: 0; } }
  @keyframes mk-wheel { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .mk-a { position: absolute; box-sizing: border-box; }
</style>
</helmet>

      </div>
    </div>
    <div class="mk-a" style="left:0;top:0;width:100%;height:100%;{{ eyeNarrowStyle }}">
      <div class="mk-a" style="left:39.6%;top:29.5%;width:6.4%;height:1.8%;border-radius:60% 60% 20% 20%;background:#2A251E;"></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:300},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;idle&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;talk&quot;,&quot;point&quot;,&quot;squint&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood || 'idle';
    const talk = mood === 'talk', point = mood === 'point';
    return {
      armAnim: point ? 'animation:mk-point 1.6s ease-in-out infinite;' : 'animation:mk-sway 4.4s ease-in-out infinite;',
      eyeOpenStyle: mood === 'squint' ? 'display:none;' : 'display:block;',
      eyeNarrowStyle: mood === 'squint' ? 'display:block;' : 'display:none;',
      mouthLineStyle: talk ? 'opacity:0;transition:opacity .14s;' : 'opacity:1;transition:opacity .14s;',
      mouthTalkStyle: talk ? 'opacity:1;animation:mk-talk 0.3s ease-in-out infinite;' : 'opacity:0;',
    };
  }
}
</script>
</body>
</html>
